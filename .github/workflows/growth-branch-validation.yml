name: Growth branch validation

on:
  push:
    branches: [codex/miryx-growth-system]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m py_compile scripts/trendjacking.py
      - run: python3 -m unittest discover -s tests -p 'test_trendjacking.py'
