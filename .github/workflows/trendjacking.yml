name: Miryx Trend-Jacking

# Toutes les 6 h (lecon JAMILA : scanner plus vite que les sources ne publient
# ne sert a rien). workflow_dispatch = declenchement manuel possible.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Jamais deux runs en meme temps (evite les conflits de push)
concurrency:
  group: trendjacking
  cancel-in-progress: false

jobs:
  trendjack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer le trend-jacking
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/trendjacking.py

      - name: Publier les nouveaux fichiers (si generes)
        run: |
          git config user.name "miryx-trendjacking-bot"
          git config user.email "bot@miryxcheck.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau a publier"
          else
            git commit -m "Nouvel article automatique"
            git pull --rebase origin main
            git push
          fi
