name: Miryx Trend-Jacking

# Toutes les 6h (pas 15 min — lecon de JAMILA : scanner plus vite que les
# sources ne publient ne sert a rien, ca ne fait que consommer le quota
# d'API pour rien). workflow_dispatch permet aussi un declenchement manuel.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trendjack:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer le trend-jacking
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/trendjacking.py

      - name: Publier les nouveaux articles (si generes)
        run: |
          git config user.name "miryx-trendjacking-bot"
          git config user.email "bot@miryxcheck.com"
          git add -A
          git diff --cached --quiet && echo "Rien de nouveau a publier" || (git commit -m "Nouvel article automatique" && git push)
